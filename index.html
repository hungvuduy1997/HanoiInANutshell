<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <title>Hanoi In A Nutshell</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <div id="map"></div>

  <div class="map-controls-row">
    <button id="modeToggle" class="control-btn">Giao diện: Tối</button>
    <button id="viewToggle" class="control-btn">Vệ tinh</button>
    <select id="themeSelect"></select>
  </div>

  <div id="legendContainer">
    <button id="legendToggle">▼</button>
    <div id="legend" class="legend open">
      <div id="legendTitle"></div>
      <div id="legendItems"></div>
    </div>
  </div>

  <div id="infoPanel"></div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <script src="https://unpkg.com/papaparse@5.4.1/papaparse.min.js"></script>

  <script src="https://unpkg.com/flatgeobuf@3.30.0/dist/flatgeobuf-geojson.min.js"></script>

  <script type="module" src="js/app.js"></script>
</body>
</html>

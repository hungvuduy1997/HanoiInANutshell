<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <title>Hanoi In A Nutshell</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <!-- External CSS Assets -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <!-- MapLibre GL CSS -->
  <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.css" />
  <link rel="stylesheet" href="style.css" />
  <!-- Preconnect to map tile and CDN servers -->
  <link rel="preconnect" href="https://unpkg.com">
  <link rel="preconnect" href="https://basemaps.cartocdn.com">
  <link rel="preconnect" href="https://mt0.google.com">
</head>
<body>

  <!-- 1. The Core Map Background -->
  <div id="map"></div>

  <!-- 2. Top-Left Theme Description Box -->
  <div id="themeDescriptionBox"></div>

  <!-- 3. Interactive Navigation & Search Row -->
  <div class="map-controls-row" style="display: flex; gap: 8px; align-items: center;">
    <button id="locateToggle" class="control-btn" title="Vị trí của tôi">📍</button>
    <button id="modeToggle" class="control-btn">☀️</button>
    <a href="https://forms.gle/g3s5MHJHr8Z9Ne1NA"
     target="_blank" 
     rel="noopener noreferrer" 
     class="control-btn suggestion-link" 
     title="Gửi góp ý / Bổ sung thông tin">
     Góp ý
  </a>
    <button id="viewToggle" class="control-btn">Vệ tinh</button>
    <select id="themeSelect"></select>
  </div>

  <!-- 4. Dynamic Legend Drawer Component -->
  <div id="legendContainer">
    <button id="legendToggle">▼</button>
    <div id="legend" class="legend open">
      <div id="legendTitle"></div>
      <div id="legendItems"></div>
    </div>
  </div>

  <!-- 5. Detailed History Information Sidebar/Panel -->
  <div id="infoPanel"></div>
  
  <!-- 6. Advanced Satellite Filter Modifiers Container -->
  <div id="satelliteFilterContainer" class="hidden">
    <div class="ruler-container">
      <div class="ruler-track-ticks"></div>
      <input type="range" id="satelliteSaturationSlider" min="0" max="100" value="100" step="1">
      <div class="ruler-labels">
        <span>0%</span>
        <span>50%</span>
        <span>100%</span>
      </div>
    </div>
  </div>

  <!-- ========================================== -->
  <!-- 7. Third-Party CDN Dependency Pipelines    -->
  <!-- ========================================== -->
  <!-- Map Engine Runtime Core Library -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <!-- MapLibre GL Core & Leaflet Integration Plugin -->
  <script src="https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.js"></script>
  <script src="https://unpkg.com/@maplibre/maplibre-gl-leaflet@0.0.20/leaflet-maplibre-gl.js"></script>
  <!-- CSV High-Performance Stream Processor -->
  <script src="https://unpkg.com/papaparse@5.4.1/papaparse.min.js"></script>
  <!-- Binary Spatial Database Decoder Streams -->
  <script src="https://unpkg.com/flatgeobuf@3.30.0/dist/flatgeobuf-geojson.min.js"></script>

  <!-- 8. Application Modular Orchestrator Entrypoint -->
  <script type="module" src="js/app.js"></script>
</body>
</html>
